# Render blueprint: SNEHA API + PostgreSQL + caregiver dashboard.
# Synthetic demo data only. Secrets are generated by Render, never stored here.
databases:
  - name: sneha-db
    databaseName: sneha
    user: sneha
    plan: free

services:
  - type: web
    name: sneha-api
    runtime: docker
    rootDir: services/api
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: SNEHA_ENVIRONMENT
        value: production
      - key: SNEHA_DATABASE_URL
        fromDatabase:
          name: sneha-db
          property: connectionString
      - key: SNEHA_SECRET_KEY
        generateValue: true
      - key: SNEHA_CONVERSATION_PROVIDER
        value: deterministic
      - key: SNEHA_CORS_ALLOWED_ORIGINS
        value: https://sneha-dashboard.onrender.com
      # Links in account emails point here.
      - key: SNEHA_DASHBOARD_URL
        value: https://sneha-dashboard.onrender.com
      # Account emails (verification, password reset) through SMTP (Brevo). The SMTP values
      # below are entered in the Render dashboard, never in this file. Set
      # SNEHA_REQUIRE_EMAIL_VERIFICATION=true once delivery has been checked.
      - key: SNEHA_EMAIL_BACKEND
        value: smtp
      - key: SNEHA_REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: SNEHA_EMAIL_FROM
        sync: false
      - key: SNEHA_SMTP_HOST
        sync: false
      - key: SNEHA_SMTP_PORT
        sync: false
      - key: SNEHA_SMTP_USERNAME
        sync: false
      - key: SNEHA_SMTP_PASSWORD
        sync: false

  - type: web
    name: sneha-dashboard
    runtime: static
    rootDir: apps/web_dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sneha-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
